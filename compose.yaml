services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foresight
      POSTGRES_PASSWORD: foresight_dev
      POSTGRES_DB: foresight
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foresight']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://foresight:foresight_dev@postgres:5432/foresight
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npm run dev"

volumes:
  postgres_data:
  node_modules:
